[project]
name = "academicpro"
version = "1.0.0"
description = "AcademicPro AI - Asistencia Académica y Auditoría APA 7ma Edición"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pypdf>=4.1.0",
    "pillow>=10.2.0",
    "supabase>=2.4.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
